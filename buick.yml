# Minimal: TLS from proxy.certs_path (localhost.pem / localhost-key.pem).
# buick init writes under certs.path (same dir here); override certs.path if init should write elsewhere.
certs:
  path: "./dev/buick/certs"
proxy:
  certs_path: "./dev/buick/certs"
services:
  service1.localhost:
    target: "http://service1:8080"

  service2.localhost:
    target: "http://service2:8080"

  service3.localhost:
    target: "http://service3:8080"
