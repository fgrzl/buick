# Minimal example: listeners default to :80 and :443 when cert_file + key_file are set.
# mkdir -p dev/buick/certs && buick init
# Targets use Compose DNS names on the same network as buickd; on the host use 127.0.0.1 (see buick.host.example.yml).
proxy:
  cert_file: "./dev/buick/certs/localhost.pem"
  key_file: "./dev/buick/certs/localhost-key.pem"
services:
  service1.localhost:
    target: "http://service1:8080"

  service2.localhost:
    target: "http://service2:8080"

  service3.localhost:
    target: "http://service3:8080"
