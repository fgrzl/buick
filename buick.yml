# Upstreams use Docker Compose service DNS names (same user-defined network as buickd).
# For buickd on the host talking to processes on localhost, use http://127.0.0.1:<port>
# targets instead (see buick.host.example.yml).
proxy:
  http: ":80"
  https: ":443"
  cert_file: "./certs/localhost.pem"
  key_file: "./certs/localhost-key.pem"

services:
  service1.localhost:
    target: "http://service1:8080"

  service2.localhost:
    target: "http://service2:8080"

  service3.localhost:
    target: "http://service3:8080"
    websocket: true
    read_timeout: "168h"
    write_timeout: "168h"
