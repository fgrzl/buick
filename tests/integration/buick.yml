# buickd config for the integration Docker stack (../../compose.yml): HTTP/HTTPS on
# :8080 / :8443 map to host 18080 / 18443. Upstreams use Compose DNS on network buick.
proxy:
  http: ":8080"
  https: ":8443"
  certs_path: "/etc/buick/certs"

services:
  service1.localhost:
    target: "http://service1:8080"

  service2.localhost:
    target: "http://service2:8080"

  service3.localhost:
    target: "http://service3:8080"
