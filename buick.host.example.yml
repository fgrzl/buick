# Example: buickd on the host with upstreams on 127.0.0.1 (adjust ports to your apps).
# buick init --config ./buick.host.example.yml  (creates cert parent dirs as needed)
proxy:
  cert_file: "./dev/buick/certs/localhost.pem"
  key_file: "./dev/buick/certs/localhost-key.pem"

services:
  api.localhost:
    target: "http://127.0.0.1:8080"
