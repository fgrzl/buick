# Integration stack: three nginx sample backends and buickd on a private network.
# Host ports 18080 (HTTP) and 18443 (HTTPS) map to buick inside the stack.
#
#   docker compose up -d --build
#   BUICK_INTEGRATION=1 go test -tags=integration ./tests/integration/...
#   docker compose down

services:
  service1:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service1.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  service2:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service2.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  service3:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service3.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  buick:
    build:
      context: .
      dockerfile: cmd/buickd/Dockerfile
    ports:
      - "18080:8080"
      - "18443:8443"
    volumes:
      - ./tests/integration/buick.yml:/etc/buick/buick.yml:ro
      - ./tests/integration/certs:/etc/buick/certs:ro
    networks: [buick]
    depends_on:
      - service1
      - service2
      - service3

networks:
  buick:
    name: buick-integration
