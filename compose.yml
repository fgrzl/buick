# Integration stack: three echo backends and buickd on a private network.
# Host ports 18080 (HTTP) and 18443 (HTTPS) map to buick inside the stack.
#
#   docker compose up -d --build
#   BUICK_INTEGRATION=1 go test -tags=integration ./tests/integration/...
#   docker compose down

services:
  service1:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service1.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  service2:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service2.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  service3:
    image: nginx:1.27-alpine
    volumes:
      - ./tests/integration/nginx/service3.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [buick]

  buickd:
    build:
      context: .
      dockerfile: cmd/buickd/Dockerfile
    # Distroless nonroot cannot create PEMs on a fresh named volume; root is acceptable for this local-only stack.
    user: "0:0"
    command: ["--config", "/etc/buick/buick.yml"]
    volumes:
      - ./compose.buick.yml:/etc/buick/buick.yml:ro
      - buick_certs:/etc/buick/certs
    networks: [buick]
    depends_on:
      - service1
      - service2
      - service3

networks:
  buick:
    name: buick-integration

volumes:
  buick_certs:
